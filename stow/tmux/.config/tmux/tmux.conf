# 24-bit color & UTF-8 support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",ghostty:Tc"
set -q -g status-utf8 on
setw -q -g utf8 on

# Enable mouse support
set -g mouse on

# Start window and pane indexing at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Catppuccin Mocha Status Bar
set -g status-position top
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 50
set -g status-right-length 100

# Left status: Session badge
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] 󰈺 #S #[fg=#cba6f7,bg=#181825] "

# Right status: Directory, host, time
set -g status-right "#[fg=#89b4fa,bg=#181825]#[fg=#11111b,bg=#89b4fa,bold] 󰉋 #{b:pane_current_path} #[fg=#b4befe,bg=#89b4fa]#[fg=#11111b,bg=#b4befe,bold] 󰍹 #h #[fg=#f5e0dc,bg=#b4befe]#[fg=#11111b,bg=#f5e0dc,bold] 󰥔 %H:%M "

# Active and inactive window tabs
set -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
set -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I:#W #[default]"

# Border colors
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
